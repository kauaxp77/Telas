<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VOSS • Criar Conta</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
background:#f6f6f7;
font-family:'Inter',sans-serif;
}

</style>

</head>

<body class="min-h-screen flex items-center justify-center p-8">

<div class="w-full max-w-3xl bg-white rounded-[40px] p-14 shadow-xl">

<div class="text-center mb-12">

<h1 class="text-6xl font-black text-[#3e3128] mb-5">
VOSS
</h1>

<p class="text-gray-500 text-lg">
Crie sua conta para acessar a área exclusiva.
</p>

</div>

<form class="grid md:grid-cols-2 gap-6">

<input
type="text"
placeholder="Nome completo"
class="h-16 rounded-[22px] bg-[#f6f6f6] px-5 outline-none"
>

<input
type="email"
placeholder="Email"
class="h-16 rounded-[22px] bg-[#f6f6f6] px-5 outline-none"
>

<input
type="password"
placeholder="Senha"
class="h-16 rounded-[22px] bg-[#f6f6f6] px-5 outline-none"
>

<input
type="text"
placeholder="CPF"
class="h-16 rounded-[22px] bg-[#f6f6f6] px-5 outline-none"
>

<input
type="text"
placeholder="Telefone"
class="h-16 rounded-[22px] bg-[#f6f6f6] px-5 outline-none"
>

<input
type="text"
placeholder="CEP"
class="h-16 rounded-[22px] bg-[#f6f6f6] px-5 outline-none"
>

<input
type="text"
placeholder="Cidade"
class="h-16 rounded-[22px] bg-[#f6f6f6] px-5 outline-none"
>

<input
type="text"
placeholder="Estado"
class="h-16 rounded-[22px] bg-[#f6f6f6] px-5 outline-none"
>

<div class="md:col-span-2">

<input
type="text"
placeholder="Endereço completo"
class="w-full h-16 rounded-[22px] bg-[#f6f6f6] px-5 outline-none"
>

</div>

<div class="md:col-span-2 mt-4">

<button
class="w-full h-16 rounded-[22px] bg-[#3e3128] text-white font-semibold text-lg">
Criar Conta
</button>

</div>

</form>

<div class="text-center mt-8">

<a href="index.html"
class="text-[#3e3128] font-semibold">
Voltar para loja
</a>

</div>

</div>

</body>
</html>
