<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VOSS • Coleção Hermès</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<style>

*{
font-family:'Inter',sans-serif;
}

body{
background:#f7f7f5;
}

html{
scroll-behavior:smooth;
}

</style>

</head>

<body>

<!-- HEADER -->
<header class="fixed top-0 left-0 w-full bg-white/90 backdrop-blur-lg z-50 border-b border-gray-100">

<div class="max-w-[1800px] mx-auto px-8 h-24 flex items-center justify-between">

<a href="index.html"
class="text-4xl font-black tracking-tight text-[#3e3128]">

VOSS

</a>

<div class="flex items-center gap-4">

<button class="w-12 h-12 rounded-2xl bg-[#f3f3f3]">
<i class="fa-solid fa-magnifying-glass"></i>
</button>

<button class="w-12 h-12 rounded-2xl bg-[#f3f3f3]">
<i class="fa-solid fa-bag-shopping"></i>
</button>

</div>

</div>

</header>


<!-- HERO -->
<section class="pt-40 pb-16 px-8">

<div class="max-w-[1800px] mx-auto">

<p class="uppercase tracking-[5px]
text-gray-400 text-sm mb-5">

Coleção exclusiva Hermès

</p>

<h1 class="text-7xl font-black leading-tight text-[#2b2b2b] mb-8">

Catálogo
Luxury
VOSS.

</h1>

<p class="text-gray-500 text-lg leading-relaxed max-w-3xl">
Explore modelos exclusivos Hermès.
Coleção premium com diferentes cores, acabamentos e estilos sofisticados.
</p>

</div>

</section>


<!-- GRID -->
<section class="px-8 pb-28">

<div id="produtos"
class="max-w-[1800px] mx-auto grid xl:grid-cols-4 lg:grid-cols-3 md:grid-cols-2 gap-8">

</div>

</section>


<script>

const imagens = [

"https://images.unsplash.com/photo-1584917865442-de89df76afd3?q=80&w=1200&auto=format&fit=crop",
"https://images.unsplash.com/photo-1594223274512-ad4803739b7c?q=80&w=1200&auto=format&fit=crop",
"https://images.unsplash.com/photo-1585487000160-6ebcfceb0d03?q=80&w=1200&auto=format&fit=crop",
"https://images.unsplash.com/photo-1548036328-c9fa89d128fa?q=80&w=1200&auto=format&fit=crop",
"https://images.unsplash.com/photo-1566150905458-1bf1fc113f0d?q=80&w=1200&auto=format&fit=crop",
"https://images.unsplash.com/photo-1581605405669-fcdf81165afa?q=80&w=1200&auto=format&fit=crop",
"https://images.unsplash.com/photo-1614179689702-355944cd0918?q=80&w=1200&auto=format&fit=crop",
"https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?q=80&w=1200&auto=format&fit=crop",
"https://images.unsplash.com/photo-1591561954557-26941169b49e?q=80&w=1200&auto=format&fit=crop",
"https://images.unsplash.com/photo-1606522754091-a3bbf9ad4cb3?q=80&w=1200&auto=format&fit=crop"
]

const nomes = [

"Hermès Birkin Black",
"Hermès Kelly Gold",
"Hermès Constance White",
"Hermès Birkin Himalayan",
"Hermès Kelly Crocodile",
"Hermès Birkin Etoupe",
"Hermès Picotin Lock",
"Hermès Evelyne TPM",
"Hermès Lindy 26",
"Hermès Garden Party",
"Hermès Jypsiere",
"Hermès Herbag Zip",
"Hermès Kelly Rose",
"Hermès Birkin White Pearl",
"Hermès Kelly Bleu",
"Hermès Constance Noir",
"Hermès Birkin Orange",
"Hermès Kelly Vert",
"Hermès Lindy Gold",
"Hermès Picotin Beige",
"Hermès Evelyne Black",
"Hermès Birkin Croco Red",
"Hermès Kelly Diamond",
"Hermès Constance Camel",
"Hermès Garden Party Brown",
"Hermès Lindy White",
"Hermès Kelly Black Edition",
"Hermès Birkin Sakura",
"Hermès Picotin Green",
"Hermès Kelly Craie",
"Hermès Constance Gold",
"Hermès Birkin Gris",
"Hermès Kelly Rouge",
"Hermès Lindy Noir",
"Hermès Garden Canvas",
"Hermès Birkin Sellier",
"Hermès Kelly Retourne",
"Hermès Constance Mini",
"Hermès Birkin Matte",
"Hermès Kelly Limited",
"Hermès Picotin Mini",
"Hermès Evelyne Etoupe",
"Hermès Birkin Fauve",
"Hermès Kelly Gris Meyer",
"Hermès Constance Elan"

]

const container = document.getElementById('produtos')

let html = ""

nomes.forEach((nome, index) => {

const imagem = imagens[index % imagens.length]

const valor = Math.floor(
Math.random() * (1700000 - 150000) + 150000
)

html += `

<div class="bg-white rounded-[35px] p-8 shadow-sm hover:-translate-y-2 transition duration-300">

<div class="bg-[#f6f6f6] rounded-[28px] p-8 mb-8 h-[420px] flex items-center justify-center overflow-hidden">

<img
src="${imagem}"
class="w-full h-full object-cover rounded-[20px]"
>

</div>

<div class="flex items-start justify-between mb-4 gap-4">

<div>

<h2 class="text-2xl font-bold mb-2">
${nome}
</h2>

<p class="text-gray-500 text-sm">
Coleção Hermès Exclusiva
</p>

</div>

<p class="text-xl font-black text-[#3e3128] whitespace-nowrap">
R$ ${valor.toLocaleString('pt-BR')}
</p>

</div>

<p class="text-gray-500 leading-relaxed mb-8">
Bolsa premium Hermès com acabamento sofisticado,
luxo exclusivo e design elegante.
</p>

<button
class="w-full h-14 rounded-[20px]
bg-[#3e3128]
hover:bg-black
transition
text-white font-semibold">

Comprar

</button>

</div>

`

})

container.innerHTML = html

</script>


<!-- FOOTER -->
<footer class="border-t border-gray-200 py-10 px-8 bg-white">

<div class="max-w-[1800px] mx-auto flex flex-col md:flex-row justify-between gap-8">

<div>

<h1 class="text-4xl font-black text-[#3e3128] mb-4">
VOSS
</h1>

<p class="text-gray-500">
Luxury Bags Experience.
</p>

</div>

<div class="flex gap-5 text-2xl text-gray-500">

<i class="fa-brands fa-instagram"></i>
<i class="fa-brands fa-pinterest"></i>
<i class="fa-brands fa-tiktok"></i>

</div>

</div>

</footer>

</body>
</html>
