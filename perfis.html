<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VOSS • Perfis</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<style>
body{
background:#f6f6f7;
font-family:'Inter',sans-serif;
}
</style>
</head>

<body class="flex">

<!-- SIDEBAR (ESTILO GERENTE) -->
<aside class="w-72 min-h-screen bg-[#1c1c1c] text-white p-8">

<h1 class="text-5xl font-black text-[#c7a17a] mb-14">
VOSS
</h1>

<nav class="space-y-4">

<a href="gerente.html"
class="flex items-center gap-4 hover:bg-[#2a2a2a] p-4 rounded-[20px]">
<i class="fa-solid fa-crown"></i>
Painel Gerente
</a>

<a href="usuarios.html"
class="flex items-center gap-4 hover:bg-[#2a2a2a] p-4 rounded-[20px]">
<i class="fa-solid fa-users"></i>
Usuários
</a>

<a href="modulos.html"
class="flex items-center gap-4 hover:bg-[#2a2a2a] p-4 rounded-[20px]">
<i class="fa-solid fa-layer-group"></i>
Módulos
</a>

<a href="perfis.html"
class="flex items-center gap-4 bg-[#8B6B4A] p-4 rounded-[20px]">
<i class="fa-solid fa-user-shield"></i>
Perfis
</a>

<a href="financeiro.html"
class="flex items-center gap-4 hover:bg-[#2a2a2a] p-4 rounded-[20px]">
<i class="fa-solid fa-coins"></i>
Financeiro
</a>

</nav>

</aside>

<!-- CONTEÚDO -->
<main class="flex-1 p-10">

<!-- HEADER -->
<div class="flex items-center justify-between mb-10">

<div>

<h1 class="text-5xl font-black">
Configuração de Perfis
</h1>

<p class="text-gray-500 mt-3">
Gerencie permissões dos usuários do sistema.
</p>

</div>

<button class="bg-[#8B6B4A] text-white px-6 py-4 rounded-[20px]">
Novo Perfil
</button>

</div>

<!-- CARD PRINCIPAL -->
<section class="bg-white rounded-[35px] p-10 shadow-sm">

<!-- SELECT -->
<div class="mb-8">

<label class="block mb-3 font-semibold text-[#8B6B4A]">
Selecionar Perfil
</label>

<select class="w-full h-16 rounded-[20px] bg-[#f6f6f6] px-5 outline-none">

<option>Gerente</option>
<option>Administrador</option>
<option>Vendedor</option>
<option>Atendente</option>

</select>

</div>

<!-- TABELA -->
<table class="w-full">

<thead>

<tr class="border-b text-gray-400">
<th class="text-left pb-5">Módulo</th>
<th class="pb-5">Visualizar</th>
<th class="pb-5">Editar</th>
<th class="pb-5">Excluir</th>
</tr>

</thead>

<tbody class="text-gray-600">

<tr class="border-b">
<td class="py-6 font-semibold">Financeiro</td>
<td class="text-center"><input type="checkbox" checked class="w-5 h-5 accent-[#8B6B4A]"></td>
<td class="text-center"><input type="checkbox" checked class="w-5 h-5 accent-[#8B6B4A]"></td>
<td class="text-center"><input type="checkbox" class="w-5 h-5 accent-[#8B6B4A]"></td>
</tr>

<tr class="border-b">
<td class="py-6 font-semibold">Estoque</td>
<td class="text-center"><input type="checkbox" checked class="w-5 h-5 accent-[#8B6B4A]"></td>
<td class="text-center"><input type="checkbox" class="w-5 h-5 accent-[#8B6B4A]"></td>
<td class="text-center"><input type="checkbox" class="w-5 h-5 accent-[#8B6B4A]"></td>
</tr>

<tr>
<td class="py-6 font-semibold">Atendimento</td>
<td class="text-center"><input type="checkbox" checked class="w-5 h-5 accent-[#8B6B4A]"></td>
<td class="text-center"><input type="checkbox" checked class="w-5 h-5 accent-[#8B6B4A]"></td>
<td class="text-center"><input type="checkbox" class="w-5 h-5 accent-[#8B6B4A]"></td>
</tr>

</tbody>

</table>

<!-- BOTÃO -->
<div class="flex justify-end mt-8">

<button class="bg-[#8B6B4A] text-white px-8 py-4 rounded-[20px]">
Salvar Permissões
</button>

</div>

</section>

</main>

</body>
</html>
