<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VOSS • Carrinho</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

*{
font-family:'Inter',sans-serif;
}

body{
background:#f7f7f5;
}

</style>

</head>

<body>

<section class="py-20 px-8">

<div class="max-w-6xl mx-auto">

<div class="flex items-center justify-between mb-14">

<h1 class="text-6xl font-black">
Carrinho
</h1>

<a href="colecao.html"
class="bg-[#3e3128]
text-white
px-8 py-5
rounded-[22px]
font-semibold">

Continuar Comprando

</a>

</div>

<div id="lista"
class="space-y-6">
</div>

</div>

</section>

<script>

const lista = document.getElementById('lista')

const carrinho = JSON.parse(localStorage.getItem('carrinho')) || []

let html = ""

carrinho.forEach(produto => {

html += `

<div class="bg-white rounded-[35px] p-8 flex gap-8 items-center shadow-sm">

<img
src="${produto.imagem}"
class="w-40 h-40 object-cover rounded-[25px]"
>

<div class="flex-1">

<h2 class="text-3xl font-black mb-3">
${produto.nome}
</h2>

<p class="text-2xl font-bold text-[#3e3128]">
${produto.preco}
</p>

</div>

<button
onclick="remover('${produto.id}')"
class="bg-red-100 text-red-600
px-6 py-4 rounded-[18px]">

Remover

</button>

</div>

`

})

lista.innerHTML = html

function remover(id){

let carrinhoAtual = JSON.parse(localStorage.getItem('carrinho')) || []

carrinhoAtual = carrinhoAtual.filter(item => item.id != id)

localStorage.setItem('carrinho', JSON.stringify(carrinhoAtual))

location.reload()

}

</script>

</body>
</html>
